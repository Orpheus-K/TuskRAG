# Optional overlay for an isolated on-prem embedding/rerank model node.
# Usage:
#   docker compose -f docker-compose.standard.yml -f docker-compose.model-node.yml up -d
services:
  tei-embed:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.6}
    restart: unless-stopped
    command:
      - --model-id
      - ${TEI_EMBED_MODEL:-BAAI/bge-m3}
      - --port
      - "8081"
    volumes:
      - model_cache:/data
    ports:
      - "127.0.0.1:8081:8081"

  tei-rerank:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.6}
    restart: unless-stopped
    command:
      - --model-id
      - ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - --port
      - "8082"
    volumes:
      - model_cache:/data
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  model_cache:
