[project]
name = "tuskrag-parser"
version = "0.5.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml==0.7.1",
    "lxml==6.1.3",
    "olefile==0.47",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "pypdfium2==5.14.0",
    "python-calamine==0.9.0",
    "python-docx==1.2.0",
    "xberg==1.3.8",
]

[project.scripts]
tuskrag-parse = "tuskrag_parser.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "lxml-stubs>=0.5,<1",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-defusedxml>=0.7.0,<1",
    "types-jsonschema>=4.25,<5",
    "types-olefile>=0.47,<1",
    "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
